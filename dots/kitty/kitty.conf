##FONTS

font_family        JetBrainsMono Nerd Font:style=Regular
bold_font          JetBrainsMono Nerd Font:style=Bold
italic_font        JetBrainsMono Nerd Font:style=Italic
bold_italic_font   JetBrainsMono Nerd Font:style=BoldItalic
font_size 15
confirm_os_window_close 0


cursor_shape beam


background #000000

background_opacity 0.2 

# START Grayscale Theme for Kitty Terminal

# Cor de fundo (preto absoluto)
background #000000

# Cor do texto (branco absoluto)
foreground #ffffff

# Cor do cursor
cursor #cccccc

# Cor do texto do cursor
cursor_text_color #000000

# Cores da seleção
selection_background #444444
selection_text_color #ffffff

# Cores da URL
url_color #888888

# Cores dos avisos do Geração Z (se houver, ajuste para tons de cinza)
# z_generation_bell_color #aaaaaa

# Cores base (tons de cinza para as 8 cores padrão)
color0 #000000
color1 #444444
color2 #888888
color3 #cccccc
color4 #666666
color5 #aaaaaa
color6 #bbbbbb
color7 #ffffff

# Cores brilhantes (equivalentes brilhantes das 8 cores padrão)
color8 #333333
color9 #777777
color10 #bbbbbb
color11 #eeeeee
color12 #999999
color13 #dddddd
color14 #eeeeee
color15 #ffffff

# Cores de destaque (se o seu shell ou aplicações usarem, ajuste para tons de cinza)
mark1_background #444444
mark1_foreground #ffffff
mark2_background #666666
mark2_foreground #ffffff
mark3_background #888888
mark3_foreground #000000

# Cores da barra de abas
active_tab_foreground #000000
active_tab_background #cccccc
inactive_tab_foreground #888888
inactive_tab_background #333333
tab_bar_background #222222

# Cores da borda da janela
# Ajuste conforme preferir um cinza sutil
window_border_color #333333
active_border_color #888888

# END Grayscale Theme for Kitty Terminal
