# --- FONTES ---
font_family      JetBrainsMono Nerd Font:style=Regular
bold_font        JetBrainsMono Nerd Font:style=Bold
italic_font      JetBrainsMono Nerd Font:style=Italic
bold_italic_font JetBrainsMono Nerd Font:style=BoldItalic
font_size 15

# --- CONFIGURAÇÕES GERAIS ---
confirm_os_window_close 0
cursor_shape beam
# Leve ajuste na opacidade, sinta-se à vontade para mudar
background_opacity 0.75

# --- PALETA DE CORES ---
# #CBC9CC (cinza claro)
# #9C90AA (lavanda)
# #6E6189 (roxo médio)
# #443A67 (roxo escuro)
# #211E46 (roxo bem escuro)
# #0C0012 (quase preto azulado)
# #000003 (preto)

# Cor de fundo principal
background #0C0012

# Cor do texto principal (foreground)
foreground #CBC9CC

# Cursor
cursor            #9C90AA
cursor_text_color #0C0012

# Seleção
selection_background #443A67
selection_foreground #CBC9CC

# URL
url_color #9C90AA

# --- CORES ANSI (Versão Corrigida) ---

# Cores Normais (0-7)
# Black (Um pouco mais claro que o fundo)
color0  #211E46
# Red (Usando lavanda para destaque)
color1  #9C90AA
# Green (Roxo médio)
color2  #6E6189
# Yellow (Lavanda, para avisos)
color3  #9C90AA
# Blue (Roxo escuro para nomes de diretórios, etc.)
color4  #65219b
# Magenta (Roxo médio)
color5  #6E6189
# Cyan (Roxo escuro)
color6  #443A67
# White
color7  #CBC9CC

# Cores Brilhantes (8-15)
# Bright Black (Roxo médio, bom para comentários)
color8  #6E6189
# Bright Red (Usando a cor mais clara para um alerta forte)
color9  #CBC9CC
# Bright Green (Lavanda para "sucesso")
color10 #9C90AA
# Bright Yellow (A cor mais clara para avisos importantes)
color11 #CBC9CC
# Bright Blue
color12 #6E6189
# Bright Magenta
color13 #9C90AA
# Bright Cyan
color14 #6E6189
# Bright White
color15 #CBC9CC

# --- INTERFACE DO KITTY (Abas, Bordas, etc.) ---
active_border_color   #9C90AA
inactive_border_color #211E46
active_tab_foreground   #0C0012
active_tab_background   #9C90AA
inactive_tab_foreground #CBC9CC
inactive_tab_background #211E46
tab_bar_background      #000003
