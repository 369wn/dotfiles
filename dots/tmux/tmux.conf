# --- Prefix e Bindings Essenciais ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- Configurações Gerais ---
set -g renumber-windows on
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB" # Habilita cores RGB/TrueColor
set -g base-index 1
set -g pane-base-index 1
set -g mouse on

# --- VIM Bindings ---
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key x kill-pane

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \;

# ================================================
# --- TEMA ROXO ---
# ================================================

# --- Bordas dos Painéis ---
# Borda inativa: Roxo médio
set -g pane-border-style fg=colour61
# Borda ativa: Roxo vibrante
set -g pane-active-border-style fg=colour177

# --- Barra de Status Principal ---
# Fundo transparente (default) e texto cinza claro
set -g status-style bg=default,fg=colour252
set -g status-position bottom # Recomendo 'top' para um visual mais moderno

# Lado esquerdo da barra (vazio)
set -g status-left ""
# Lado direito da barra (Data e Hora em Lavanda)
set -g status-right ""
set -g status-right-length 60

# --- Abas das Janelas na Barra de Status ---
# Aba inativa: Roxo médio
set -g window-status-format "#[fg=colour61] #I "
# Aba ativa: Roxo vibrante com fundo roxo médio
set -g window-status-current-format "#[fg=colour181,bg=colour61] #I "

# Estilo para notificações em outras janelas (ex: mensagem)
set -g window-status-bell-style "bg=colour61,fg=colour177,bold"

# Estilo para janela com zoom (ativado com 'z')
# Fundo roxo vibrante e texto preto para máximo destaque
set -g window-status-current-style bg=colour177,fg=black,bold

# --- Mensagens do Tmux (ex: ao recarregar) ---
set -g message-style bg=colour61,fg=colour177,bold
