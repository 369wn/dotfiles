set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Theme: borders
set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=white

set -g renumber-windows on
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"
set -g status-style bg=black,fg=white
set -g pane-active-border-style fg=colour250
set -g message-style bg=colour238,fg=white
set -g status-right '#[fg=colour250]%d/%m %H:%M'
set -g base-index 1
set -g pane-base-index 1

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf

setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key x kill-pane

set -g mouse on

#bar
set -g status-style bg=default,fg=white,bright
set -g status-left ""
set -g status-right "#[fg=white, bright]#S"

set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=white

# Theme: status
set -g status-style bg=default,fg=white
set -g status-left ""
set -g status-right "#[fg=black,bright]#S"

# Theme: status (windows)
set -g window-status-format " #I "
set -g window-status-current-format " #I "
set -g window-status-bell-style "bg=red,nobold"
set -g window-status-current-style "#{?window_zoomed_flag,bg=yellow,bg=red,nobold}"
