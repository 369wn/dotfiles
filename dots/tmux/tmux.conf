# Default prefix and unbind C-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- Theme: Borders ---
set -g pane-border-lines simple
set -g pane-border-style fg=colour238,bright 
set -g pane-active-border-style fg=colour250

# --- General Settings ---
set -g renumber-windows on
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# --- Status Bar Settings ---
set -g status-style bg=default,fg=colour255
set -g status-left ""
set -g status-right '#[fg=colour250]%d/%m %H:%M'
set -g status-right-length 60 

# --- Window Status (Barra inferior de janelas) ---
set -g window-status-format "#[fg=colour245] #I "
set -g window-status-current-format "#[fg=colour255,bg=colour238] #I " 
set -g window-status-bell-style "bg=colour238,fg=colour255,nobold" 

set -g window-status-current-style "#{?window_zoomed_flag,bg=colour245,fg=colour235,nobold}" 

# --- Message Style ---
set -g message-style bg=colour238,fg=colour255 

# --- Base Indexes ---
set -g base-index 1
set -g pane-base-index 1

# --- Key Bindings ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf

setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key x kill-pane

set -g mouse on

